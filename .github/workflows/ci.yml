name: Code-a-thon 2026 CI / Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite (JUnit 5 + Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Backend Tests
        run: |
          cd backend
          mvn clean test

  code-runner-tests:
    name: Code Runner Sandbox & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd code-runner
          npm install

      - name: Start Runner & Execute Tests
        run: |
          cd code-runner
          node server.js &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5050/health > /dev/null; then
              echo "Code Runner is UP and healthy on port 5050"
              break
            fi
            echo "Waiting for Code Runner to start... ($i/30)"
            sleep 1
          done
          node --test test/runner.test.js

  frontend-build:
    name: Frontend TypeScript & Turbopack Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Next.js Production Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
