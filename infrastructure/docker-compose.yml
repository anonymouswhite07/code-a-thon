version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codeathon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeathon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal_net

  code-runner:
    build:
      context: ../code-runner
      dockerfile: Dockerfile
    container_name: codeathon_runner
    restart: unless-stopped
    ports:
      - "5050:5050"
    networks:
      - internal_net
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: codeathon_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - code-runner
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/codeathon
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgrespassword
      CODE_RUNNER_URL: http://code-runner:5050
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:80
    ports:
      - "8080:8080"
    networks:
      - internal_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: codeathon_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080/api/v1
    ports:
      - "3000:3000"
    networks:
      - internal_net

  nginx:
    image: nginx:alpine
    container_name: codeathon_proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  pgdata:
