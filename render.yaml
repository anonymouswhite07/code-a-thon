services:
  # Unified All-in-One Backend + Compilers (C, Python 3, Java) Code Runner
  - type: web
    name: codeathon-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/rounds
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ALLOWED_ORIGINS
        value: https://code-a-thon-mu.vercel.app,https://*.vercel.app,http://localhost:3000,http://localhost:3001
      - key: CODE_RUNNER_URL
        value: http://127.0.0.1:5050
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
