services:
  # 1. Spring Boot 3 Backend API
  - type: web
    name: codeathon-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/rounds
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:3000,http://localhost:3001
      - key: CODE_RUNNER_URL
        value: http://codeathon-runner:5050
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:mem:codeathondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      - key: SPRING_DATASOURCE_DRIVER
        value: org.h2.Driver
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: password

  # 2. Ephemeral Code Execution Sandbox Runner
  - type: web
    name: codeathon-runner
    env: docker
    dockerfilePath: code-runner/Dockerfile
    dockerContext: code-runner
    plan: starter
    region: oregon
    envVars:
      - key: PORT
        value: 5050
