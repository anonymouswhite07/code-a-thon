server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: codeathon-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:postgresql://postgres.qxoedpvxmbseyugwspxc:OW6c3E8ZwHPSq7RP@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  code-runner:
    url: ${CODE_RUNNER_URL:http://127.0.0.1:5050}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,https://*.vercel.app,https://code-a-thon-mu.vercel.app,https://*.onrender.com,https://code-a-thon-xgko.onrender.com}

logging:
  level:
    com.gnanamani.codeathon: INFO
    org.springframework.security: WARN
