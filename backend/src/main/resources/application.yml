server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: codeathon-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:codeathondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  code-runner:
    url: ${CODE_RUNNER_URL:http://localhost:5050}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,https://*.vercel.app,https://*.onrender.com}

logging:
  level:
    com.gnanamani.codeathon: INFO
    org.springframework.security: WARN
